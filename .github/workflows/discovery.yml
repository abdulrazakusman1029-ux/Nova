name: Nova discovery poll

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nova-discovery-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run discovery poll
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          NOVA_MIN_LIQUIDITY_USD: "5000"
        run: python3 nova_discovery.py --once

      - name: Commit updated data files
        run: |
          git config user.name "nova-discovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Discovery poll: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
